name: Validate ML Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        # pytest is a test-only dependency, so it stays out of the pinned requirements.txt
        # (which is mirrored byte-for-byte to src/requirements.txt for the Cloud Function).
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest

      - name: Run unit tests
        # pytest also collects the unittest-style tests; several suites use pytest fixtures.
        run: python -m pytest tests -v

      - name: Compile source tree
        run: python -m compileall src scripts cloud_functions
